<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pattern Flashcards — Recognize before coding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..900,0..100,0..1;1,9..144,300..900,0..100,0..1&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=JetBrains+Mono:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:     #f3eddc;
    --paper-2:   #ebe2cc;
    --paper-3:   #e3d8bd;
    --ink:       #1a1410;
    --ink-2:     #3c352d;
    --ink-3:     #6b6155;
    --accent:    #8b2c1c;
    --accent-2:  #b34a2a;
    --tan:       #a07c52;
    --gold:      #f4dfa8;
    --gold-2:    #ead09a;
    --muted:     #5a5147;
    --hair:      #c8bea4;
    --good:      #4a6b3a;
    --good-soft: #d9e3cf;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }

  /* home nav link */
  .home-link {
    position: fixed;
    top: 20px;
    left: 20px;
    background: var(--ink);
    color: var(--paper);
    text-decoration: none;
    padding: 6px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    z-index: 100;
    transition: background 0.15s;
  }
  .home-link:hover { background: var(--accent); }

  body {
    background: var(--paper);
    background-image:
      radial-gradient(ellipse at 12% 8%, rgba(139,44,28,0.04), transparent 60%),
      radial-gradient(ellipse at 88% 95%, rgba(160,124,82,0.06), transparent 55%);
    color: var(--ink);
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding: 32px 24px 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .wrap { max-width: 880px; width: 100%; }

  /* ========= HEADER ========= */
  header.top {
    border-bottom: 1.5px solid var(--ink);
    padding-bottom: 18px;
    margin-bottom: 22px;
    position: relative;
  }
  header.top .x-link {
    position: absolute;
    top: 4px;
    right: 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    text-decoration: none;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 600;
    padding: 4px 8px;
    border: 1px solid var(--accent);
    transition: all 0.15s;
  }
  header.top .x-link:hover {
    background: var(--accent);
    color: var(--paper);
  }
  header.top::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: -3px;
    height: 1px;
    background: var(--accent);
  }
  header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: 52px;
    line-height: 0.9;
    letter-spacing: -0.04em;
    margin: 0 0 6px;
    font-variation-settings: "opsz" 144, "SOFT" 0, "WONK" 0;
  }
  header h1 em {
    font-style: italic;
    color: var(--accent);
    font-variation-settings: "opsz" 144, "SOFT" 100, "WONK" 1;
  }
  header .sub {
    font-family: 'Fraunces', serif;
    font-style: italic;
    color: var(--ink-2);
    font-size: 18px;
    font-variation-settings: "opsz" 24, "SOFT" 100, "WONK" 1;
  }

  /* ========= CATEGORY FILTER ========= */
  .filter-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 20px;
    align-items: center;
  }
  .filter-row .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    color: var(--accent);
    text-transform: uppercase;
    margin-right: 6px;
  }
  .filter-row .chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 5px 11px;
    background: transparent;
    color: var(--ink-2);
    border: 1px solid var(--hair);
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    transition: all 0.15s;
  }
  .filter-row .chip:hover { background: var(--paper-2); }
  .filter-row .chip.active {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  /* ========= COUNTER ========= */
  .counter {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 16px;
    color: var(--ink-2);
    font-variation-settings: "opsz" 24, "SOFT" 100, "WONK" 1;
  }
  .counter .num {
    font-family: 'JetBrains Mono', monospace;
    color: var(--accent);
    font-weight: 700;
    font-style: normal;
    font-size: 18px;
  }
  .counter .known-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--good);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* ========= CARD (with flip) ========= */
  .card-stage {
    perspective: 1500px;
    margin-bottom: 24px;
    min-height: 380px;
  }
  .card {
    position: relative;
    width: 100%;
    min-height: 380px;
    transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1);
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    padding: 38px 44px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 30px 60px -28px rgba(0,0,0,0.35), 0 8px 20px -10px rgba(0,0,0,0.2);
    overflow: hidden;
  }
  .card .face::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
  }
  .card .front::before { background: var(--accent); }
  .card .back {
    transform: rotateY(180deg);
    background: linear-gradient(180deg, var(--paper-2) 0%, var(--paper) 70%);
  }
  .card .back::before { background: var(--ink); }

  /* known indicator */
  .card .known-mark {
    position: absolute;
    top: 16px;
    right: 18px;
    font-size: 22px;
    line-height: 1;
    user-select: none;
    color: var(--hair);
    transition: color 0.2s;
    z-index: 10;
  }
  .card[data-known="true"] .known-mark {
    color: var(--good);
  }

  /* category tag */
  .category-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .category-tag::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--hair);
  }
  .category-tag .num-tag {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 13px;
    color: var(--ink-3);
    letter-spacing: 0;
    font-variation-settings: "opsz" 14, "SOFT" 100, "WONK" 1;
    margin-left: auto;
    padding-left: 6px;
  }

  /* front content */
  .front .signal-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--ink-3);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .front .signal {
    font-family: 'Fraunces', serif;
    font-weight: 800;
    font-size: 28px;
    line-height: 1.2;
    letter-spacing: -0.018em;
    color: var(--ink);
    font-variation-settings: "opsz" 144, "SOFT" 0, "WONK" 0;
    flex: 1;
    display: flex;
    align-items: center;
  }
  .front .quote-style { font-style: italic; }
  .front .quote-style::before {
    content: '"';
    color: var(--accent);
    margin-right: 2px;
  }
  .front .quote-style::after {
    content: '"';
    color: var(--accent);
  }
  .front .examples-front {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px dotted var(--hair);
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    align-items: baseline;
  }
  .front .examples-front .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-right: 4px;
  }
  .front .examples-front .pill {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 13px;
    color: var(--ink-2);
    background: transparent;
    padding: 0 3px;
    text-decoration: none;
    border-bottom: 1px dotted transparent;
    transition: color 0.15s, border-color 0.15s;
    font-variation-settings: "opsz" 14, "SOFT" 100, "WONK" 1;
  }
  .front .examples-front .pill:hover {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .front .examples-front .pill:not(:last-child)::after {
    content: ' ·';
    color: var(--ink-3);
    margin-left: 4px;
  }
  .front .hint {
    margin-top: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--ink-3);
    text-transform: uppercase;
    text-align: center;
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: center;
  }
  .front .hint .key {
    font-family: 'JetBrains Mono', monospace;
    padding: 2px 8px;
    background: var(--ink);
    color: var(--paper);
    border-radius: 2px;
    font-size: 9px;
    letter-spacing: 0.1em;
  }

  /* back content */
  .back .pattern-name {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: 32px;
    line-height: 1;
    letter-spacing: -0.025em;
    color: var(--ink);
    font-variation-settings: "opsz" 144, "SOFT" 0, "WONK" 0;
    margin-bottom: 4px;
  }
  .back .pattern-name em {
    font-style: italic;
    color: var(--accent);
    font-variation-settings: "opsz" 144, "SOFT" 100, "WONK" 1;
  }
  .back .ds-line {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--accent);
    margin-bottom: 18px;
  }
  .back .complexity-row {
    display: flex;
    gap: 18px;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--hair);
  }
  .back .complexity-block {
    flex: 1;
  }
  .back .complexity-block .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 3px;
  }
  .back .complexity-block .value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--ink);
    font-weight: 600;
  }
  .back .memory-hook {
    background: rgba(139, 44, 28, 0.08);
    border-left: 3px solid var(--accent);
    padding: 9px 14px;
    margin: 0 0 14px;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 15.5px;
    color: var(--ink);
    line-height: 1.3;
    font-variation-settings: "opsz" 14, "SOFT" 100, "WONK" 1;
  }
  .back .memory-hook .lbl {
    font-family: 'JetBrains Mono', monospace;
    font-style: normal;
    font-size: 8.5px;
    letter-spacing: 0.22em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 2px;
    font-variation-settings: "opsz" 14;
    display: block;
  }
  .back .why {
    font-family: 'Source Serif 4', serif;
    font-size: 14.5px;
    line-height: 1.5;
    color: var(--ink-2);
    margin-bottom: 12px;
    flex: 1;
  }
  .back .why .key-phrase {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 700;
    color: var(--ink);
    font-variation-settings: "opsz" 14, "SOFT" 100, "WONK" 1;
  }
  .back .pitfall {
    background: rgba(163, 38, 28, 0.07);
    border-left: 3px solid var(--bad);
    padding: 8px 12px;
    margin: 0 0 14px;
    font-size: 13px;
    color: var(--ink-2);
    line-height: 1.35;
  }
  .back .pitfall .lbl {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8.5px;
    letter-spacing: 0.22em;
    color: var(--bad);
    text-transform: uppercase;
    margin-bottom: 2px;
    display: block;
  }
  .back .pitfall code {
    font-family: 'JetBrains Mono', monospace;
    background: var(--bad-soft, rgba(163,38,28,0.15));
    padding: 0 4px;
    font-size: 12px;
    color: var(--bad);
  }
  .back .examples-row {
    border-top: 1px solid var(--hair);
    padding-top: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .back .examples-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-right: 4px;
  }
  .back .example-pill {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 13px;
    background: var(--gold);
    color: var(--ink);
    padding: 3px 10px;
    text-decoration: none;
    transition: background 0.15s, color 0.15s;
    font-variation-settings: "opsz" 14, "SOFT" 100, "WONK" 1;
  }
  .back .example-pill:hover {
    background: var(--accent);
    color: var(--paper);
  }

  /* ========= CONTROLS ========= */
  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    padding: 14px 18px;
    background: var(--ink);
    color: var(--paper);
  }
  .controls button {
    background: var(--accent);
    color: var(--paper);
    border: none;
    padding: 8px 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    cursor: pointer;
    text-transform: uppercase;
    transition: background 0.15s;
  }
  .controls button:hover { background: var(--accent-2); }
  .controls button.ghost {
    background: transparent;
    color: var(--paper);
    border: 1px solid var(--paper);
  }
  .controls button.ghost:hover { background: rgba(243,237,220,0.12); }
  .controls .spacer { flex: 1; }
  .controls .hint-text {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 12px;
    color: var(--paper-2);
    font-variation-settings: "opsz" 14, "SOFT" 100, "WONK" 1;
  }
  .controls .hint-text .k {
    font-family: 'JetBrains Mono', monospace;
    background: rgba(243,237,220,0.15);
    padding: 1px 6px;
    margin: 0 2px;
    font-style: normal;
    border-radius: 2px;
    font-size: 10px;
  }

  /* known mark button */
  .controls .star-btn {
    background: var(--gold);
    color: var(--ink);
    font-weight: 700;
  }
  .controls .star-btn:hover { background: var(--gold-2); }
  .controls .star-btn.is-known {
    background: var(--good);
    color: var(--paper);
  }

  /* ========= RESPONSIVE ========= */
  @media (max-width: 600px) {
    body { padding: 18px 12px 40px; }
    header h1 { font-size: 38px; }
    header .sub { font-size: 15px; }
    .card .face { padding: 28px 26px; }
    .front .signal { font-size: 22px; }
    .back .pattern-name { font-size: 24px; }
    .back .why { font-size: 14px; }
    .controls { padding: 10px 12px; }
    .controls button { padding: 7px 11px; font-size: 10px; }
  }

  /* ========= EMPTY STATE ========= */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-3);
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 18px;
    font-variation-settings: "opsz" 24, "SOFT" 100, "WONK" 1;
  }
</style>
</head>
<body>
<a href="index.html" class="home-link">↶ Home</a>
<div class="wrap">

  <header class="top">
    <h1>Patterns<em>.</em></h1>
    <div class="sub">— Flashcards. See the signal, name the pattern, before any code.</div>
    <a href="patterns_cheatsheet.html" class="x-link">↗ Cheatsheet</a>
  </header>

  <!-- CATEGORY FILTER -->
  <div class="filter-row" id="filter-row">
    <div class="label">filter</div>
    <button class="chip active" data-cat="all">All</button>
    <button class="chip" data-cat="hashmap">Hash Map</button>
    <button class="chip" data-cat="two-pointers">Two Pointers</button>
    <button class="chip" data-cat="sliding-window">Sliding Window</button>
    <button class="chip" data-cat="binary-search">Binary Search</button>
    <button class="chip" data-cat="heap">Heap</button>
    <button class="chip" data-cat="stack">Stack</button>
    <button class="chip" data-cat="linked-list">Linked List</button>
    <button class="chip" data-cat="tree-graph">Tree / Graph</button>
    <button class="chip" data-cat="array-misc">Array / Misc</button>
    <button class="chip" data-cat="greedy">Greedy</button>
    <button class="chip" data-cat="dp">Dynamic Programming</button>
    <button class="chip" data-cat="unknown">Unknown only</button>
  </div>

  <!-- COUNTER -->
  <div class="counter">
    <div>Card <span class="num" id="cur-idx">1</span> of <span class="num" id="total">—</span></div>
    <div class="known-count">★ <span id="known-count">0</span> known</div>
  </div>

  <!-- CARD STAGE -->
  <div class="card-stage">
    <div class="card" id="card">
      <!-- front and back faces injected dynamically -->
    </div>
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <button id="prev-btn">← Prev</button>
    <button id="flip-btn">Flip</button>
    <button id="next-btn">Next →</button>
    <button class="ghost" id="shuffle-btn">Shuffle</button>
    <button class="star-btn" id="mark-btn">★ Mark known</button>
    <div class="spacer"></div>
    <div class="hint-text">
      <span class="k">space</span>flip ·
      <span class="k">←</span> <span class="k">→</span>navigate ·
      <span class="k">k</span>mark
    </div>
  </div>

</div>

<script>
/* ===================== CARD DATA ===================== */
const CARDS = [
  // ----- HASH MAP / SET (7) -----
  {
    cat: 'hashmap', catLabel: 'Hash Map',
    signal: 'Find a pair of numbers that sum to target — input is UNSORTED.',
    pattern: 'Hash map of complements',
    memoryHook: 'The "magic notebook" — write x as you pass, look up <code>target − x</code> instantly.',
    ds: 'dict: value → index',
    time: 'O(n)', space: 'O(n)',
    why: 'Walk once. For each <code>x</code>, ask the dict: <span class="key-phrase">"have I seen target − x?"</span> If yes, return the pair. If no, store x with its index.',
    pitfall: 'Check the dict BEFORE adding x. Otherwise x could pair with itself, e.g. <code>[3, 3]</code> target 6.',
    examples: ['Two Sum']
  },
  {
    cat: 'hashmap', catLabel: 'Hash Map',
    signal: 'Detect duplicates / "has X been seen before?"',
    pattern: 'Set existence check',
    memoryHook: 'The "bouncer\'s guest list" — already on it = duplicate. Otherwise: add and walk past.',
    ds: 'set',
    time: 'O(n)', space: 'O(n)',
    why: 'Walk the input. For each item, is it in the set? Yes → duplicate found, return True. No → add it. Stop on first hit for fast exit.',
    pitfall: 'Use <code>set()</code> for empty, NOT <code>{}</code> (that\'s an empty dict).',
    examples: ['Contains Duplicate']
  },
  {
    cat: 'hashmap', catLabel: 'Hash Map',
    signal: 'Are two strings anagrams of each other?',
    pattern: 'Counter equality',
    memoryHook: '"Same letter recipe" — both strings reduce to the same frequency map.',
    ds: 'collections.Counter',
    time: 'O(n)', space: 'O(k)',
    why: '<code>Counter(s) == Counter(t)</code>. Both strings reduced to the same <code>{char: count}</code> map iff they\'re anagrams of each other.',
    pitfall: 'Check lengths first — if they differ, immediate False. Saves the Counter build.',
    examples: ['Valid Anagram']
  },
  {
    cat: 'hashmap', catLabel: 'Hash Map',
    signal: 'Group items by a derived key (e.g., anagrams together).',
    pattern: 'Hash map of lists',
    memoryHook: '"Auto-bucket on first sight" — defaultdict creates the list when needed.',
    ds: 'defaultdict(list)',
    time: 'O(n · k)', space: 'O(n)',
    why: 'Compute a stable key per item (sorted letters, frequency tuple, etc.). <code>groups[key].append(item)</code>. <span class="key-phrase">defaultdict auto-creates the bucket</span> on first sight — no <code>if key not in dict</code> dance.',
    pitfall: 'Create the defaultdict ONCE outside the loop. Inside-the-loop creation resets state every iteration.',
    examples: ['Group Anagrams']
  },
  {
    cat: 'hashmap', catLabel: 'Hash Map',
    signal: 'Frequency / count of each item in a sequence.',
    pattern: 'Counter / defaultdict(int)',
    memoryHook: '"One walk, +1 per item." Counter(seq) does it in one call.',

/* ===================== STATE ===================== */
let state = {
  filteredCards: [...CARDS],
  currentIdx: 0,
  knownIds: new Set(JSON.parse(localStorage.getItem('flashcard_known') || '[]')),
  activeFilter: 'all',
  flipped: false
};

function saveKnown() {
  localStorage.setItem('flashcard_known', JSON.stringify([...state.knownIds]));
}

function cardKey(card) {
  // Stable key based on the signal text
  return card.signal;
}

/* ===================== DOM REFS ===================== */
const cardEl = document.getElementById('card');
const curIdxEl = document.getElementById('cur-idx');
const totalEl = document.getElementById('total');
const knownCountEl = document.getElementById('known-count');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const flipBtn = document.getElementById('flip-btn');
const shuffleBtn = document.getElementById('shuffle-btn');
const markBtn = document.getElementById('mark-btn');

/* ===================== FILTERS ===================== */
function applyFilter(cat) {
  state.activeFilter = cat;
  if (cat === 'all') {
    state.filteredCards = [...CARDS];
  } else if (cat === 'unknown') {
    state.filteredCards = CARDS.filter(c => !state.knownIds.has(cardKey(c)));
  } else {
    state.filteredCards = CARDS.filter(c => c.cat === cat);
  }
  state.currentIdx = 0;
  state.flipped = false;
  render();
}

document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    applyFilter(chip.dataset.cat);
  });
});

/* ===================== RENDER ===================== */
function render() {
  totalEl.textContent = state.filteredCards.length;
  knownCountEl.textContent = state.knownIds.size;

  if (state.filteredCards.length === 0) {
    cardEl.innerHTML = `
      <div class="face front" style="position:relative; transform:none;">
        <div class="empty-state">
          No cards match this filter.<br>
          Try a different category.
        </div>
      </div>
    `;
    curIdxEl.textContent = '0';
    return;
  }

  const card = state.filteredCards[state.currentIdx];
  const isKnown = state.knownIds.has(cardKey(card));

  curIdxEl.textContent = state.currentIdx + 1;
  cardEl.dataset.known = isKnown ? 'true' : 'false';
  cardEl.classList.toggle('flipped', state.flipped);

  markBtn.textContent = isKnown ? '★ Known' : '☆ Mark known';
  markBtn.classList.toggle('is-known', isKnown);

  const exampleLink = name => `<a class="example-pill" href="index.html?problem=${encodeURIComponent(name)}" title="Open ${name} practice script">${name}</a>`;
  const exampleLinkFront = name => `<a class="pill" href="index.html?problem=${encodeURIComponent(name)}" title="Open ${name} practice script">${name}</a>`;
  const examplesHTML = card.examples.map(exampleLink).join('');
  const examplesHTMLFront = card.examples.map(exampleLinkFront).join('');

  cardEl.innerHTML = `
    <div class="face front">
      <div class="known-mark">${isKnown ? '★' : '☆'}</div>
      <div class="category-tag">
        <span>${card.catLabel}</span>
        <span class="num-tag">card ${state.currentIdx + 1} of ${state.filteredCards.length}</span>
      </div>
      <div class="signal-label">The signal</div>
      <div class="signal"><span class="quote-style">${card.signal}</span></div>
      <div class="examples-front">
        <span class="label">Maps to</span>
        ${examplesHTMLFront}
      </div>
      <div class="hint">
        <span class="key">space</span> reveal the pattern
      </div>
    </div>
    <div class="face back">
      <div class="known-mark">${isKnown ? '★' : '☆'}</div>
      <div class="category-tag">
        <span>${card.catLabel}</span>
        <span class="num-tag">card ${state.currentIdx + 1} of ${state.filteredCards.length}</span>
      </div>
      <div class="pattern-name">${card.pattern}<em>.</em></div>
      ${card.memoryHook ? `<div class="memory-hook"><span class="lbl">Memory hook</span>${card.memoryHook}</div>` : ''}
      <div class="ds-line">${card.ds}</div>
      <div class="complexity-row">
        <div class="complexity-block">
          <div class="label">Time</div>
          <div class="value">${card.time}</div>
        </div>
        <div class="complexity-block">
          <div class="label">Space</div>
          <div class="value">${card.space}</div>
        </div>
      </div>
      <div class="why">${card.why}</div>
      ${card.pitfall ? `<div class="pitfall"><span class="lbl">⚠ Watch out</span>${card.pitfall}</div>` : ''}
      <div class="examples-row">
        <div class="examples-label">Examples</div>
        ${examplesHTML}
      </div>
    </div>
  `;
}

/* ===================== NAVIGATION ===================== */
function next() {
  if (state.filteredCards.length === 0) return;
  state.currentIdx = (state.currentIdx + 1) % state.filteredCards.length;
  state.flipped = false;
  render();
}
function prev() {
  if (state.filteredCards.length === 0) return;
  state.currentIdx = (state.currentIdx - 1 + state.filteredCards.length) % state.filteredCards.length;
  state.flipped = false;
  render();
}
function flip() {
  state.flipped = !state.flipped;
  render();
}
function shuffle() {
  // Fisher-Yates
  const arr = state.filteredCards;
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  state.currentIdx = 0;
  state.flipped = false;
  render();
}
function toggleKnown() {
  if (state.filteredCards.length === 0) return;
  const card = state.filteredCards[state.currentIdx];
  const key = cardKey(card);
  if (state.knownIds.has(key)) {
    state.knownIds.delete(key);
  } else {
    state.knownIds.add(key);
  }
  saveKnown();
  render();
}

/* ===================== EVENTS ===================== */
cardEl.addEventListener('click', flip);
flipBtn.addEventListener('click', flip);
nextBtn.addEventListener('click', next);
prevBtn.addEventListener('click', prev);
shuffleBtn.addEventListener('click', shuffle);
markBtn.addEventListener('click', toggleKnown);

document.addEventListener('keydown', (e) => {
  if (e.key === ' ') { e.preventDefault(); flip(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
  else if (e.key === 'k' || e.key === 'K') { e.preventDefault(); toggleKnown(); }
  else if (e.key === 's' || e.key === 'S') { e.preventDefault(); shuffle(); }
});

/* ===================== INIT ===================== */
/* If URL has #cat=<category>, pre-apply that filter (used by deep links from index.html badge) */
(() => {
  const m = window.location.hash.match(/cat=([a-z-]+)/);
  if (!m) { render(); return; }
  const cat = m[1];
  const chip = document.querySelector(`.chip[data-cat="${cat}"]`);
  if (!chip) { render(); return; }
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  applyFilter(cat);
})();
</script>
